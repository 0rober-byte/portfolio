name: Optimize RobGD portrait images
on:
  push:
    branches:
      - feature/robgd-phase4-discovery-analytics
    paths:
      - .github/workflows/robgd-optimize-photos.yml
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/robgd-phase4-discovery-analytics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert portraits to visually faithful WebP
        run: |
          python -m pip install --quiet pillow==11.3.0
          python -c 'from PIL import Image; from pathlib import Path; [(lambda im, n: (im.save("assets/images/Foto-"+n+".webp",format="WEBP",quality=94,method=6),print(n,im.size)))(Image.open("assets/images/Foto "+n+".png").convert("RGBA"),n) for n in ("1","2")]'
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/Foto-1.webp assets/images/Foto-2.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized original RobGD portraits as WebP"
            git push origin HEAD:feature/robgd-phase4-discovery-analytics
          fi
