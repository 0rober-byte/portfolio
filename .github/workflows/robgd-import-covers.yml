name: Import user-supplied RobGD covers
on:
  push:
    branches:
      - audit/robgd-phase1-2026-11-21
    paths:
      - .github/workflows/robgd-import-covers.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/robgd-phase1-2026-11-21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact approved files and verify their integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/robgd-covers assets/images/covers
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3K8bYEYXrjqBcq03ZOzklUGtia3/613eb2a1-7016-4a59-adf9-ab6e7509d422.jpg' -o '/tmp/robgd-covers/eurorepar.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3K8bYEYXrjqBcq03ZOzklUGtia3/306c1722-5220-46cd-a721-3f75859779df.jpg' -o '/tmp/robgd-covers/chana.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3K8bYEYXrjqBcq03ZOzklUGtia3/65e2b9f6-4283-427d-b8bc-4e04bf885165.jpg' -o '/tmp/robgd-covers/nicanor.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3K8bYEYXrjqBcq03ZOzklUGtia3/8276715d-43a9-4710-af0e-210f5b15fb4a.jpg' -o '/tmp/robgd-covers/gloow.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3K8bYEYXrjqBcq03ZOzklUGtia3/edcf5eb7-466f-4dd5-bd69-e1557438478b.jpg' -o '/tmp/robgd-covers/bav.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3K8bYEYXrjqBcq03ZOzklUGtia3/6b90e321-7ff1-4fc4-8d43-d822a049f116.jpg' -o '/tmp/robgd-covers/red.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3K8bYEYXrjqBcq03ZOzklUGtia3/c93fb39d-de6b-4ba3-bb74-d0b4c268cf2f.jpg' -o '/tmp/robgd-covers/control.jpg'
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3K8bYEYXrjqBcq03ZOzklUGtia3/c239a912-d885-4b95-8c48-1f3925aa82aa.jpg' -o '/tmp/robgd-covers/ipi.jpg'
          cat > /tmp/robgd-sha.txt <<'HASHES'
54ba0a3adc15e01fe91e9ec63c7b3bcf49ef9d8c43a20134b74260cc4ae06796  /tmp/robgd-covers/eurorepar.jpg
2305e20f4bf504b3d03795a57de3a9c393351a990a8ea505011dc0c83222eeb4  /tmp/robgd-covers/chana.jpg
9106daa009615ceea3737371eee8a4c3ef08eaae0ce03ab9730e623636812a26  /tmp/robgd-covers/nicanor.jpg
f8cffcbf68a96cfc4dd987d6d2bf8160ba63be9e4159a1587ca65dc6d2d8e0cb  /tmp/robgd-covers/gloow.jpg
0c737cbb09b0f81edac7bf44fa3ca26a2fe4eac1506f7b6050b53be685182337  /tmp/robgd-covers/bav.jpg
e83dada413b0ffc0341f76970364daba67c45e47894e8b3d2c696b918f6aafdf  /tmp/robgd-covers/red.jpg
5e2f998c1b8330668c2a624c67e672803e9ef1ed5666c5dbbefb1778722f29b3  /tmp/robgd-covers/control.jpg
4d3343db6816e46edbf7b616cff05df219808642275c80b5fabcb30cdf176457  /tmp/robgd-covers/ipi.jpg
HASHES
          sha256sum --check /tmp/robgd-sha.txt
      - name: Create high-quality optimized WebP covers
        run: |
          python -m pip install --quiet pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for source in sorted(Path('/tmp/robgd-covers').glob('*.jpg')):
              image = Image.open(source).convert('RGB')
              image.save(Path('assets/images/covers')/(source.stem+'.webp'), 'WEBP', quality=93, method=6)
              print(source.stem, image.size)
          PY
      - name: Commit covers to this review branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/covers/
          if ! git diff --cached --quiet; then
            git commit -m 'Add eight approved optimized project cover images'
            git push origin HEAD:audit/robgd-phase1-2026-11-21
          fi
